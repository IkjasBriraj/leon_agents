[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcraft-backend"
version = "0.1.0"
description = "AgentCraft — Enterprise-Grade Agentic AI Platform Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.5",

    # Redis
    "redis[hiredis]>=5.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",

    # LLM (Ollama via LiteLLM)
    "litellm>=1.51.0",
    "ollama>=0.4.0",

    # HTTP client
    "httpx>=0.28.0",

    # Docker sandbox
    "docker>=7.1.0",

    # Validation & serialization
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",

    # Embedding (local with Ollama)
    "sentence-transformers>=3.3.0",

    # Observability
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",

    # Task scheduling
    "apscheduler>=3.10.4",

    # Utilities
    "python-dotenv>=1.0.1",
    "orjson>=3.10.11",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "cryptography>=43.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
